<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mancilla Budget">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<title>Mancilla Budget</title>
<style>
:root{
  --bg:#000000; --panel:#111111; --panel2:#1A1A1A; --line:rgba(255,255,255,.09);
  --line2:rgba(255,255,255,.18);
  --tx:#F4F4F4; --mut:#A6A6A6; --dim:#6E6E6E;
  --violet:#3E6AE1; --cyan:#FFFFFF; --green:#22C55E; --red:#E31937; --amber:#F59E0B; --blue:#3E6AE1;
  --sans:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{color:var(--tx);font-family:var(--sans);-webkit-text-size-adjust:100%;
  padding-bottom:calc(40px + env(safe-area-inset-bottom));overflow-x:hidden}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
@keyframes draw{to{stroke-dashoffset:0}}
.draw{stroke-dasharray:3000;stroke-dashoffset:3000;animation:draw 1.8s cubic-bezier(.4,0,.2,1) forwards}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
.shell{display:flex;min-height:100vh}

/* sidebar */
aside{width:212px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
  padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px}
.mark{width:30px;height:30px;border-radius:4px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#000000;flex-shrink:0}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand span{display:block;font-size:10px;color:var(--dim);font-weight:500}
aside button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;
  color:var(--mut);font:600 13px var(--sans);padding:10px 12px;border-radius:6px;cursor:pointer;
  margin-bottom:2px;text-align:left;transition:background .15s,color .15s}
aside button:hover{background:var(--panel2);color:var(--tx)}
aside button[data-on="true"]{background:rgba(255,255,255,.08);
  color:#fff}
aside button[data-on="true"] .dot{background:var(--violet)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex-shrink:0}
.sidefoot{margin-top:18px;padding:14px 12px;border-radius:6px;background:var(--panel2);border:1px solid var(--line)}

main{flex:1;min-width:0;padding:26px 26px 60px}
.mtabs{display:none}

.hero{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.pad{padding:18px}
.grid{display:grid;gap:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:15px}
.chip{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:13px;margin-bottom:9px}
.big{font-size:31px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px}
input,textarea{background:var(--panel2);border:1px solid var(--line2);color:var(--tx);
  padding:9px 11px;border-radius:6px;font-size:16px;font-family:var(--mono);text-align:right;width:112px}
input::placeholder{color:var(--dim)}
input:focus,button:focus-visible{outline:2px solid var(--violet);outline-offset:1px}
.btn{background:var(--violet);color:#fff;border:0;padding:12px 18px;border-radius:4px;text-transform:uppercase;letter-spacing:.06em;
  font:700 12px var(--sans);cursor:pointer}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line2);padding:7px 12px;font-size:11px}
.btn.ghost:hover{color:var(--tx)}
table{width:100%;border-collapse:collapse}
th{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700;
  padding:11px 13px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right;background:var(--panel2)}
th:first-child{text-align:left}
td{padding:11px 13px;border-bottom:1px solid var(--line);font-size:12.5px;text-align:right}
td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
svg{width:100%;display:block}
.note{font-size:11.5px;color:var(--mut);line-height:1.6}
details.fold{background:var(--panel);border:1px solid var(--line);border-radius:6px}
details.fold>summary{list-style:none;cursor:pointer;padding:15px 16px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;color:var(--tx)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font-family:var(--mono);color:var(--dim);font-size:16px}
details.fold[open]>summary::after{content:"\2212"}
details.fold>summary small{font-weight:400;color:var(--dim);font-size:11px;margin-left:8px}
details.fold>.body{padding:0 10px 10px}
details.fold>.body>.grid{gap:12px}
.mini{height:5px;border-radius:99px;background:var(--panel2);overflow:hidden}
.mini>i{display:block;height:100%;border-radius:99px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(90px);
  background:var(--panel2);border:1px solid var(--line2);color:var(--tx);padding:12px 18px;
  border-radius:6px;font-size:13px;transition:transform .25s;z-index:60;max-width:88vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:860px){
  aside{display:none}
  main{padding:16px 14px 60px}
  .mtabs{display:block;position:sticky;top:0;z-index:20;background:rgba(10,11,18,.93);
    backdrop-filter:blur(14px);margin:-16px -14px 14px;padding:12px 14px 0;
    padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
  .mtabs .row{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
  .mtabs .row::-webkit-scrollbar{display:none}
  .mtabs button{background:var(--panel);border:1px solid var(--line);color:var(--mut);
    font:700 11.5px var(--sans);padding:8px 14px;border-radius:99px;white-space:nowrap;cursor:pointer}
  .mtabs button[data-on="true"]{background:#fff;border-color:#fff;color:#000}
  .big{font-size:27px}
}
</style>
</head>
<body>
<div class="shell">
<aside>
  <div class="brand">
    <div class="mark">D</div>
    <div><b>Descent</b><span>Adacy &amp; wife</span></div>
  </div>
  <div id="nav"></div>
  <div class="sidefoot">
    <div class="eyebrow">Debt-free</div>
    <div id="sidefree" style="font-size:17px;font-weight:800;margin-top:4px">—</div>
    <div class="note" id="sidecars" style="font-size:10.5px">&nbsp;</div>
    <div class="syncstat" style="margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:10px;color:var(--dim)">Connecting&hellip;</div>
  </div>
</aside>
<main>
  <div class="mtabs"><div class="row" id="mnav"></div></div>
  <div id="view"></div>
</main>
</div>
<div id="toast"></div>
<script>
"use strict";
var START_TOTAL=52253, CAR_TOTAL=75500, VAR_BUDGET=780;

/* Everyday spending assumed per day in future months, once this month's
   budget no longer applies. */
var VAR_MIN_RATE=VAR_BUDGET/30;

var MONLBL=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

/* Month indexing. Index 0 is AUG 2026, the month the plan was written.
   Everything on the charts is placed by this index, so the axis can grow
   or shrink as the real numbers move. */
var ORIGIN_Y=2026, ORIGIN_M=7;
function mi(d){return (d.getFullYear()-ORIGIN_Y)*12+d.getMonth()-ORIGIN_M;}
function keyFromMi(i){var n=ORIGIN_Y*12+ORIGIN_M+i;return MONLBL[n%12]+" "+Math.floor(n/12);}
function nowIdx(){return mi(new Date());}

/* The plan exactly as it was written in Aug 2026. It is NOT used for any
   calculation any more — it is only drawn as the faint line on the chart so
   you can see whether you are ahead of where you said you would be. */
var BASELINE=[["AUG 2026",48923],["SEP 2026",46828],["OCT 2026",44704],["NOV 2026",41357],["DEC 2026",38025],["JAN 2027",34646],["FEB 2027",31334],["MAR 2027",27951],["APR 2027",24490],["MAY 2027",20946],["JUN 2027",17334],["JUL 2027",13689],["AUG 2027",9978],["SEP 2027",6709],["OCT 2027",4190],["NOV 2027",1958],["DEC 2027",0]];

/* VA disability compensation, from October 2026. It is paid for the 1st of the
   month, but never lands ON a day the banks are shut: when the 1st is a weekend
   or a federal holiday it arrives on the last banking day BEFORE it, never
   after. That means some months are paid at the end of the month before. */
var DISABILITY=1700, DIS_START=new Date(2026,9,1);

function nthDow(y,m,dow,n){var d=new Date(y,m,1);
  d.setDate(1+((dow-d.getDay())+7)%7+(n-1)*7);return d;}
function lastDow(y,m,dow){var d=new Date(y,m+1,0);
  d.setDate(d.getDate()-((d.getDay()-dow)+7)%7);return d;}
var _hol={};
function holidays(y){
  if(_hol[y])return _hol[y];
  var h={};
  function put(d){h[d.getMonth()+"-"+d.getDate()]=1;}
  function fixed(m,day){var d=new Date(y,m,day),w=d.getDay();put(d);
    if(w===6)put(new Date(y,m,day-1));
    if(w===0)put(new Date(y,m,day+1));}
  fixed(0,1);fixed(5,19);fixed(6,4);fixed(10,11);fixed(11,25);
  put(nthDow(y,0,1,3));put(nthDow(y,1,1,3));put(lastDow(y,4,1));
  put(nthDow(y,8,1,1));put(nthDow(y,9,1,2));put(nthDow(y,10,4,4));
  _hol[y]=h;return h;}
function isBankDay(d){var w=d.getDay();
  if(w===0||w===6)return false;
  return !holidays(d.getFullYear())[d.getMonth()+"-"+d.getDate()];}

/* The day the benefit for month (y,m) actually lands. Walks backwards from the
   1st, so it can fall in the previous month. */
function disabilityDay(y,m){var d=new Date(y,m,1),g=0;
  while(!isBankDay(d)&&g++<12)d.setDate(d.getDate()-1);
  return d;}
/* How much disability lands on this exact date — checks this month's benefit
   and next month's, since next month's can be paid early into this one. */
function disabilityPayOn(d){
  for(var i=0;i<2;i++){
    var bm=new Date(d.getFullYear(),d.getMonth()+i,1);
    if(bm<DIS_START)continue;
    var p=disabilityDay(bm.getFullYear(),bm.getMonth());
    if(p.getFullYear()===d.getFullYear()&&p.getMonth()===d.getMonth()&&p.getDate()===d.getDate())
      return DISABILITY;
  }
  return 0;}

/* The extra payment on top of the minimums. EXTRA_BASE is what was already
   going out before the benefit started. DIS_TO_DEBT is the slice of the $1,700
   that goes to debt rather than to bills — $700, the amount that clears the
   plan inside twelve months. The other $1,000 stays in checking. */
var EXTRA_BASE=515, DIS_TO_DEBT=700;
function extraFor(d){return EXTRA_BASE+(d>=DIS_START?DIS_TO_DEBT:0);}
function extraThisMonth(){return extraFor(new Date());}
function thisMonthKey(){var d=new Date();return MONLBL[d.getMonth()]+" "+d.getFullYear();}

/* name, starting balance, APR, minimum, day of month, kind, credit limit.
   Limits come from the Sep 2026 TransUnion report. A limit of 0 means an
   instalment loan or plan — it has no utilisation. */
var SEED=[
 ["BRIGHTWAY",1217,35.99,55,5,"CARD",1650],["SEEN",950,35.99,55,15,"CARD",1000],
 ["CHARIZARD",0,35.98,144,25,"BNPL",0],["AFFIRM VIRTUAL",5294,35.98,562,5,"BNPL",0],
 ["AFFIRM AMZN 5",609,34.00,72,1,"BNPL",0],["UPSTART 2",11629,32.32,425,28,"LOAN",0],
 ["UPSTART 1",7716,30.21,320,4,"LOAN",0],["PAYPAL",1700,29.99,32,22,"CARD",2000],
 ["AMEX ADACY",0,29.99,40,9,"CARD",1000],["AFFIRM AMZN 1",0,29.99,43,22,"BNPL",0],
 ["AFFIRM AMZN 4",0,29.99,54,1,"BNPL",0],["AFFIRM AMZN 3",0,29.98,51,27,"BNPL",0],
 ["CAP ONE VENTURE",325,29.00,25,1,"CARD",500],["SPARROW",815,28.99,42,7,"CARD",900],
 ["CAP ONE SAVOR",375,28.74,40,15,"CARD",500],["APPLE CARD",0,27.74,20,30,"CARD",500],
 ["CHASE",0,27.49,230,17,"CARD",7200],["CREDIT ONE",0,27.49,40,15,"CARD",1750],
 ["USAA",920,27.40,45,12,"CARD",1000],["CITI COSTCO",3905,26.74,120,20,"CARD",4000],
 ["AFFIRM AMZN 2",484,24.71,109,23,"BNPL",0],["UPSTART 3",2676,0.0,243,22,"LOAN",0],
 ["BEST BUY",997,31.99,40,8,"CARD",1150],["KLARNA",1338,34.99,213,17,"BNPL",0],
 ["UPGRADE",2314,26.00,170,21,"LOAN",0],
 ["ALLY",34975,1.99,905,28,"AUTO",0],["TOYOTA FINANCIAL",38919,8.01,769,29,"AUTO",0]];

/* Open cards with nothing on them. They never draft and they are not debt,
   but their limits are most of your available credit, so they belong in the
   utilisation maths — and they must stay open. */
var OPEN_ZERO=[["MILITARY STAR",5700],["MISSION LANE",1350],["MISSION LANE 2",750],
  ["OLLO",1000],["PETAL",600],["AMAZON STORE",100],["PAYPAL CREDIT",110]];
var ZERO_LIMIT=OPEN_ZERO.reduce(function(a,x){return a+x[1];},0);
var NOPLAN={"ALLY":1,"TOYOTA FINANCIAL":1};
var ISACCT={};SEED.forEach(function(s){ISACCT[s[0]]=1;});

/* Total contractual minimums, including accounts already paid off. When one
   dies its minimum is not saved — it rolls onto the next target. That is the
   whole engine, so the number stays constant on purpose. */
var BASE_MIN=SEED.filter(function(s){return !NOPLAN[s[0]];}).reduce(function(a,s){return a+s[3];},0);
var CAR_MIN=SEED.filter(function(s){return NOPLAN[s[0]];}).reduce(function(a,s){return a+s[3];},0);

var FLOW=[[1,"RENT",-3000],[1,"CAP ONE VENTURE",-25],[1,"AFFIRM AMZN 4",-54],[1,"AFFIRM AMZN 5",-72],
[4,"UPSTART 1",-320],[5,"BRIGHTWAY",-55],[5,"AFFIRM VIRTUAL",-562],[7,"PAYCHECK 1",4773],
[7,"SPARROW",-42],[8,"BEST BUY",-40],[9,"AMEX ADACY",-40],[12,"USAA",-45],[12,"UTILITIES",-375],
[17,"KLARNA",-213],[21,"UPGRADE",-170],
[15,"CAP ONE SAVOR",-40],[15,"CREDIT ONE",-40],[15,"SEEN",-55],[17,"CHASE",-230],
[20,"CITI COSTCO",-120],[21,"FEDERAL TAX",-530],[21,"STATE TAX",-752],[22,"PAYCHECK 2",5800],
[22,"PAYPAL",-32],[22,"UPSTART 3",-243],[22,"AFFIRM AMZN 1",-43],[23,"AFFIRM AMZN 2",-109],
[25,"CHARIZARD",-144],[25,"CAR INSURANCE",-230],[27,"AFFIRM AMZN 3",-51],[28,"UPSTART 2",-425],
[28,"ALLY",-905],[28,"PHONE",-180],[29,"TOYOTA FINANCIAL",-769],[30,"APPLE CARD",-20]];
/* The extra goes out the day after the first paycheck of the month, once rent
   has cleared. Sending it on the 23rd put it on the wrong side of rent and
   pushed the first week of the following month under. */
var EXTRA_DAY=8;
function ord(n){var s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}

var KINDCOL={CARD:"var(--red)",LOAN:"var(--blue)",BNPL:"var(--amber)",AUTO:"var(--cyan)"};
var DAYN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MONN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

var PRIVATE=false; /* the artifact build sets this true */
var KEY="adacy-debt-v2";
var state={accounts:{},cash:{balance:0,updated:null},history:[],spend:[]};
var tab="today", spendTest="";

function money(n){return "$"+Math.round(Math.abs(Number(n)||0)).toLocaleString("en-US");}
function signed(n){return (n<0?"−":"")+money(n);}
function fmtDate(d){return DAYN[d.getDay()]+" "+MONN[d.getMonth()]+" "+d.getDate();}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function defaults(){var o={};SEED.forEach(function(s){o[s[0]]=s[1];});return o;}
function spanTxt(m){if(m<=0)return "now";var y=Math.floor(m/12),r=m%12;
  return (y?y+" yr"+(r?" "+r+" mo":""):r+" mo");}

function load(){
  var fromHash=null;
  if(location.hash.length>3){
    try{fromHash=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1).replace(/-/g,"+").replace(/_/g,"/")))));}catch(e){}
  }
  var saved=null;
  try{var r=localStorage.getItem(KEY);if(r)saved=JSON.parse(r);}catch(e){}
  var src=saved||{};
  state={accounts:Object.assign(defaults(),src.accounts||{}),
         cash:src.cash||{balance:0,updated:null},
         history:src.history||[],spend:src.spend||[]};
  if(fromHash){
    var t=fromHash.cash&&fromHash.cash.updated?new Date(fromHash.cash.updated).getTime():0;
    var m=state.cash&&state.cash.updated?new Date(state.cash.updated).getTime():0;
    if(t>=m){
      state={accounts:Object.assign(defaults(),fromHash.accounts||{}),
             cash:fromHash.cash||state.cash,history:fromHash.history||state.history,
             spend:fromHash.spend||state.spend};
      save();toast("Loaded the newer numbers from that link");
    } else toast("That link was older than this phone — kept yours");
    history.replaceState(null,"",location.pathname+location.search);
  }
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast("Couldn't save on this device");}}
function syncLink(){
  var b=btoa(unescape(encodeURIComponent(JSON.stringify(state)))).replace(/\+/g,"-").replace(/\//g,"_");
  return location.origin+location.pathname+"#"+b;
}
var tT;function toast(m){var e=document.getElementById("toast");if(!e)return;e.textContent=m;e.className="on";
  clearTimeout(tT);tT=setTimeout(function(){e.className="";},3200);}

function accounts(){return SEED.map(function(s){
  return {name:s[0],start:s[1],apr:s[2],min:s[3],day:s[4],kind:s[5],limit:s[6]||0,
          current:Math.max(0,Number(state.accounts[s[0]]!=null?state.accounts[s[0]]:s[1]))};});}
function isCard(x){return x.kind==="CARD"&&x.limit>0;}
function util(x){return x.limit>0?x.current/x.limit:0;}
function planAccounts(){return accounts().filter(function(x){return !NOPLAN[x.name];});}
function carAccounts(){return accounts().filter(function(x){return NOPLAN[x.name];});}
function totals(){
  var a=planAccounts(),rem=a.reduce(function(s,x){return s+Math.max(0,x.current);},0);
  return {remaining:rem,cleared:START_TOTAL-rem,count:a.length,
    pct:Math.max(0,Math.min(100,(START_TOTAL-rem)/START_TOTAL*100)),
    paid:a.filter(function(x){return x.current<=0;}).length,
    min:a.filter(function(x){return x.current>0;}).reduce(function(s,x){return s+x.min;},0),
    freed:a.filter(function(x){return x.current<=0;}).reduce(function(s,x){return s+x.min;},0)};}

/* Who gets the extra. Cards come before loans, because a card balance counts
   against your credit score every month it sits there and a loan balance
   barely does — and the card APRs here are as high as the loans anyway, so
   it costs almost nothing in interest. Among cards, the fullest one first:
   that is the one dragging the score hardest. Among loans, biggest interest
   bleed first, as before. */
function rank(p,q){
  var pc=isCard(p)?1:0,qc=isCard(q)?1:0;
  if(pc!==qc)return qc-pc;
  if(pc)return util(q)-util(p)||q.current*q.apr-p.current*p.apr;
  return q.current*q.apr-p.current*p.apr;
}
function targetAccount(){
  var live=planAccounts().filter(function(x){return x.current>0;}).sort(rank);
  return live[0]||null;
}

/* ---------------- THE ENGINE ----------------
   Everything below — the curve, the payoff dates, the bars, the debt-free
   month, the interest comparison — is recalculated from the balances you
   type in. Nothing is stored from the original plan. */

function simulate(list,poolFn,maxMonths){
  var A=list.map(function(x){return {name:x.name,bal:Math.max(0,Number(x.bal)||0),
    apr:Number(x.apr)||0,min:Number(x.min)||0,kind:x.kind||"LOAN",limit:Number(x.limit)||0};});
  function snap(){var o={};A.forEach(function(x){o[x.name]=x.bal;});return o;}
  var d=new Date();d=new Date(d.getFullYear(),d.getMonth(),1);
  var i0=mi(d),pts=[],payoff={},interest=0;
  var tot=A.reduce(function(s,x){return s+x.bal;},0);
  pts.push({i:i0,total:tot,bal:snap()});
  A.forEach(function(x){if(x.bal<=0)payoff[x.name]=keyFromMi(i0);});
  var k=0;
  for(;k<maxMonths&&tot>0.5;k++){
    var pool=poolFn(d,i0+k);
    A.forEach(function(x){if(x.bal>0){var it=x.bal*x.apr/100/12;x.bal+=it;interest+=it;}});
    A.forEach(function(x){if(x.bal>0&&pool>0){var p=Math.min(x.min,x.bal,pool);x.bal-=p;pool-=p;}});
    var live=A.filter(function(x){return x.bal>0;}).map(function(x){
        return {ref:x,current:x.bal,apr:x.apr,kind:x.kind,limit:x.limit};})
      .sort(rank).map(function(w){return w.ref;});
    for(var j=0;j<live.length&&pool>0.005;j++){
      var p2=Math.min(pool,live[j].bal);live[j].bal-=p2;pool-=p2;}
    d=new Date(d.getFullYear(),d.getMonth()+1,1);
    var lab=keyFromMi(i0+k+1);
    A.forEach(function(x){if(x.bal<=0.005){x.bal=0;if(!payoff[x.name])payoff[x.name]=lab;}});
    tot=A.reduce(function(s,x){return s+x.bal;},0);
    pts.push({i:i0+k+1,total:tot,bal:snap()});
  }
  return {pts:pts,payoff:payoff,interest:interest,zeroIdx:i0+k,months:k,done:tot<=0.5};
}

/* What happens if you only ever pay the minimums. Loans and Affirm plans keep
   their fixed instalment. Revolving cards are modelled the way issuers
   actually set a minimum — interest plus 1% of the balance, never below the
   stated minimum — otherwise a card whose minimum is smaller than its
   monthly interest never amortises at all. */
function simMinOnly(list){
  var A=list.map(function(x){return {bal:Math.max(0,Number(x.bal)||0),apr:Number(x.apr)||0,
    min:Number(x.min)||0,card:x.kind==="CARD"};});
  var interest=0,k=0,i0=nowIdx();
  for(;k<600;k++){
    var tot=A.reduce(function(s,x){return s+x.bal;},0);
    if(tot<=0.5)break;
    A.forEach(function(x){
      if(x.bal<=0)return;
      var it=x.bal*x.apr/100/12;x.bal+=it;interest+=it;
      var due=x.card?Math.max(x.min,it+x.bal*0.01):x.min;
      var pay=Math.min(x.bal,due);
      x.bal-=pay;if(x.bal<0.005)x.bal=0;});
  }
  return {zeroIdx:i0+k,interest:interest,months:k};
}

var _plan=null,_cars=null,_mono=null,_flow=null;
function bust(){_plan=null;_cars=null;_mono=null;_flow=null;}

function plan(){
  if(_plan)return _plan;
  var list=planAccounts().map(function(x){return {name:x.name,bal:x.current,apr:x.apr,min:x.min,kind:x.kind,limit:x.limit};});
  _plan=simulate(list,function(d){return BASE_MIN+extraFor(d);},420);
  return _plan;
}
function cars(){
  if(_cars)return _cars;
  var z=plan().zeroIdx;
  var list=carAccounts().map(function(x){return {name:x.name,bal:x.current,apr:x.apr,min:x.min};});
  _cars=simulate(list,function(d,k){return CAR_MIN+(k>=z?BASE_MIN+extraFor(d):0);},420);
  return _cars;
}
function minOnly(){
  if(_mono)return _mono;
  _mono=simMinOnly(planAccounts().map(function(x){return {bal:x.current,apr:x.apr,min:x.min,kind:x.kind};}));
  return _mono;
}
/* Utilisation: what is on the cards divided by what the cards could hold.
   Includes the open cards with nothing on them — that is exactly why they
   must not be closed. */
function cardLimitTotal(){return planAccounts().filter(isCard).reduce(function(s,x){return s+x.limit;},0)+ZERO_LIMIT;}
function cardBalTotal(){return planAccounts().filter(isCard).reduce(function(s,x){return s+x.current;},0);}
function utilNow(){var L=cardLimitTotal();return L?cardBalTotal()/L:0;}
/* The month the plan first has overall utilisation under a given fraction. */
function utilUnderBy(frac){
  var p=plan(),L=cardLimitTotal(),cards=planAccounts().filter(isCard);
  if(!L)return null;
  for(var k=0;k<p.pts.length;k++){
    var b=p.pts[k].bal,sum=0;cards.forEach(function(c){sum+=Math.max(0,b[c.name]||0);});
    if(sum/L<frac)return keyFromMi(p.pts[k].i);
  }
  return null;
}
/* What it would take, today, to get every card under a threshold. */
function costToThreshold(frac){
  return planAccounts().filter(isCard).reduce(function(s,x){
    return s+Math.max(0,x.current-x.limit*frac);},0);
}

function goneBy(name){
  var m=NOPLAN[name]?cars().payoff:plan().payoff;
  return m[name]||"—";
}

function monthKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function spendThisMonth(){var k=monthKey(new Date());
  return (state.spend||[]).filter(function(e){return e.date.slice(0,7)===k;})
    .reduce(function(s,e){return s+Number(e.amount||0);},0);}
function budgetLeft(){return VAR_BUDGET-spendThisMonth();}
function daysLeftInMonth(){var d=new Date();
  return Math.max(1,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate()+1);}

/* What's actually in Chase, allowing for purchases logged since you last
   typed the balance in. Anything logged before that refresh is already
   inside the number you typed, so it isn't subtracted twice. */
function loggedSinceRefresh(){
  var t=state.cash.updated?new Date(state.cash.updated).getTime():0;
  return (state.spend||[]).filter(function(e){return e.id>t;})
    .reduce(function(s,e){return s+Number(e.amount||0);},0);}
function workingBalance(){return (Number(state.cash.balance)||0)-loggedSinceRefresh();}

/* Everyday spending still to come this month, per day. Spread over the days
   that are actually left, so what's already spent plus what's reserved comes
   to exactly the monthly budget — never more. Money already spent has left
   the working balance, so it is not reserved for a second time. */
function daysAheadInMonth(){var d=new Date();
  return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate();}
function currentDrip(){var n=daysAheadInMonth();
  return n>0?Math.max(0,budgetLeft())/n:0;}
function dripFor(d){var n=new Date();
  if(d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth())return currentDrip();
  return VAR_BUDGET/30;}

/* The month's drafts, as they actually are now. A paid-off account no longer
   drafts, and an account with less left than its minimum only drafts what is
   left. The extra payment is included too — it is real money leaving the
   account on the 23rd. */
function liveFlow(){
  if(_flow)return _flow;
  var out=[];
  FLOW.forEach(function(f){
    if(!ISACCT[f[1]]){out.push(f);return;}
    var b=Math.max(0,Number(state.accounts[f[1]])||0);
    if(b<=0)return;
    out.push([f[0],f[1],-Math.min(Math.abs(f[2]),Math.round(b))]);
  });
  var tg=targetAccount();
  if(tg){
    var amt=Math.min(extraThisMonth(),Math.max(0,Math.round(tg.current-tg.min)));
    if(amt>0)out.push([EXTRA_DAY,"EXTRA → "+tg.name,-amt]);
  }
  out.sort(function(a,b){return a[0]-b[0]||a[2]-b[2];});
  _flow=out;return out;
}
function flowEvents(d){
  var dis=disabilityPayOn(d);
  return dis?liveFlow().concat([[d.getDate(),"DISABILITY",dis]]):liveFlow();}
function forecast(startBal,days){
  var t0=new Date();t0.setHours(0,0,0,0);
  var bal=Number(startBal)||0,out=[];
  for(var k=1;k<=days;k++){
    var d=new Date(t0);d.setDate(t0.getDate()+k);
    var dom=d.getDate(),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    var hits=flowEvents(d).filter(function(f){return f[0]===dom||(f[0]>last&&dom===last);})
      .sort(function(a,b){return a[2]-b[2];});
    bal-=dripFor(d);
    var items=hits.map(function(f){bal+=f[2];return {name:f[1],amt:f[2]};});
    out.push({date:new Date(d),items:items,bal:bal,drip:dripFor(d)});
  }
  return out;
}
/* How far ahead the cash forecast looks. Two full months, so the next
   rent and the one after it are both inside the window. */
var HORIZON=62;
function troughOf(bal){var f=forecast(bal,HORIZON),t={bal:Number(bal)||0,date:null};
  f.forEach(function(d){if(d.bal<t.bal)t={bal:d.bal,date:d.date};});return {fc:f,tr:t};}

/* Plain-language note about when the next payment actually lands. */
function disNote(){
  var n=new Date(), p=disabilityDay(n.getFullYear(),n.getMonth()), i=0;
  while(p<n||new Date(p.getFullYear(),p.getMonth(),1)<DIS_START){
    i++;p=disabilityDay(n.getFullYear(),n.getMonth()+i);if(i>14)break;}
  return 'Disability of '+money(DISABILITY)+' is paid for the 1st of each month from Oct 2026. When the 1st is a weekend or a federal holiday it lands the banking day before, never after \u2014 next one <b>'+fmtDate(p)+'</b>. '+
    money(DIS_TO_DEBT)+' of it goes to debt; the rest stays here for bills.';
}

       '<line x1="'+PL+'" x2="'+(W-14)+'" y1="'+yv(0)+'" y2="'+yv(0)+'" stroke="rgba(255,255,255,.18)"/>'+
       '<text x="'+(PL-8)+'" y="'+(yv(0)+4)+'" text-anchor="end" font-size="10" fill="#6E6E6E" font-family="var(--mono)">0</text>'+

/* ---------------- WINDFALL ----------------
   A lump sum — bonus, tax refund, a car sold, back pay. Where it goes is
   decided by what moves the credit score most per dollar, then by the
   payoff. The order:
     0. Plug any hole in the two-month cash forecast. A late payment costs
        more score than any payoff gains, so cash comes first.
     1. Every card under 90%. A maxed card is the worst thing on the file
        after the late itself, and it is what triggered the limit cuts.
     2. Every card under 50%, then 30%, then 10%, then to zero. Inside each
        tier the card that is cheapest to get over the line goes first — more
        cards cross per dollar, and small cards die outright, which drops the
        count of accounts carrying a balance and frees their draft.
     3. Whatever is left goes to the loans and plans by interest bleed. */
var windTest="";
var CASH_FLOOR=300, CHEAP_KILL=500;
var TIERS=[[.90,"under 90%","a maxed card reads worst"],
  [.50,"under 50%","stops reading as maxed"],
  [.30,"under 30%","the line every model watches"],
  [.10,"under 10%","where a card stops hurting"],
  [0,"to zero","one less account with a balance"]];
function utilLabel(b,limit){return limit>0?Math.round(b/limit*100)+"%":"";}
function windfallPlan(W){
  W=Math.max(0,Math.round(Number(W)||0));
  var r={amount:W,reserve:0,trough:null,items:[],leftover:0};
  if(W<=0)return r;
  var bal={};planAccounts().forEach(function(x){bal[x.name]=x.current;});
  var pool=W;
  /* keep the two-month forecast at least CASH_FLOOR above zero */
  if(state.cash.updated){var t=troughOf(workingBalance()).tr;r.trough=t;
    if(t.bal<CASH_FLOOR){r.reserve=Math.min(pool,Math.ceil((CASH_FLOOR-t.bal)/10)*10);pool-=r.reserve;}}
  var order=[],byName={};
  function give(x,amt,ti){amt=Math.round(Math.min(amt,pool,bal[x.name]));if(amt<=0)return;
    var it=byName[x.name];
    if(!it){it=byName[x.name]={name:x.name,amt:0,from:bal[x.name],kind:x.kind,limit:x.limit,apr:x.apr,min:x.min,tier:ti};order.push(it);}
    it.amt+=amt;it.tier=ti;bal[x.name]-=amt;pool-=amt;it.to=bal[x.name];}
  var cards=planAccounts().filter(function(x){return isCard(x)&&x.current>0;});
  for(var ti=0;ti<TIERS.length&&pool>0;ti++){
    var f=TIERS[ti][0];
    /* once nothing is maxed, a small card is worth killing outright: a zero
       balance beats a lower one, and its draft comes back every month */
    if(ti===1)cards.filter(function(x){return bal[x.name]>0&&bal[x.name]<=CHEAP_KILL;})
      .sort(function(a,b){return bal[a.name]-bal[b.name];}).forEach(function(x){give(x,bal[x.name],4);});
    cards.map(function(x){var target=f>0?Math.floor(x.limit*f)-1:0;return {x:x,gap:bal[x.name]-target};})
      .filter(function(n){return n.gap>0;}).sort(function(a,b){return a.gap-b.gap;})
      .forEach(function(n){give(n.x,n.gap,ti);});
  }
  /* a lump sum saves interest at the account's rate, whatever its size — so
     loans and plans go by APR, highest first; a whole payoff also frees its draft */
  if(pool>0){planAccounts().filter(function(x){return !isCard(x)&&x.current>0;})
    .sort(function(p,q){return q.apr-p.apr||p.current-q.current;})
    .forEach(function(x){if(pool>0)give(x,bal[x.name],-1);});}
  /* label each card by the line it actually crossed, not the one it was aiming at */
  order.forEach(function(it){if(it.limit<=0)return;it.tier=-2;
    for(var k=0;k<TIERS.length;k++){var f=TIERS[k][0];if(it.to<=(f>0?Math.floor(it.limit*f)-1:0))it.tier=k;}});
  r.items=order;r.leftover=pool;

  /* before and after */
  var before=plan(),L=cardLimitTotal();
  var list=planAccounts().map(function(x){return {name:x.name,bal:bal[x.name],apr:x.apr,min:x.min,kind:x.kind,limit:x.limit};});
  var after=simulate(list,function(d){return BASE_MIN+extraFor(d);},420);
  var cb=0,ca=0,o30b=0,o30a=0;
  cards.forEach(function(x){cb+=x.current;ca+=bal[x.name];if(util(x)>=.3)o30b++;if(bal[x.name]/x.limit>=.3)o30a++;});
  var zeroed=order.filter(function(it){return it.to<=0;});
  r.before={free:before.done?keyFromMi(before.zeroIdx):"—",months:before.months,interest:before.interest,util:L?cb/L:0,over30:o30b};
  r.after={free:after.done?keyFromMi(after.zeroIdx):"—",months:after.months,interest:after.interest,util:L?ca/L:0,over30:o30a,
    freed:zeroed.reduce(function(s,it){return s+it.min;},0),zeroed:zeroed.length};

  /* the honest alternative: the same money by interest bleed alone */
  var b2={};planAccounts().forEach(function(x){b2[x.name]=x.current;});
  var p2=W-r.reserve;
  planAccounts().filter(function(x){return x.current>0;})
    .sort(function(p,q){return q.current*q.apr-p.current*p.apr;})
    .forEach(function(x){if(p2<=0)return;var a=Math.min(p2,b2[x.name]);b2[x.name]-=a;p2-=a;});
  var alt=simulate(planAccounts().map(function(x){return {name:x.name,bal:b2[x.name],apr:x.apr,min:x.min,kind:x.kind,limit:x.limit};}),
    function(d){return BASE_MIN+extraFor(d);},420);
  var cu=0;cards.forEach(function(x){cu+=b2[x.name];});
  r.alt={interest:alt.interest,util:L?cu/L:0,free:alt.done?keyFromMi(alt.zeroIdx):"—",
    first:planAccounts().filter(function(x){return x.current>0;}).sort(function(p,q){return q.current*q.apr-p.current*p.apr;})[0]};
  return r;
}
function windRows(r){
  var rows=r.items.map(function(it,i){
    var card=it.limit>0;
    var why=it.tier>=0?TIERS[it.tier][1]+" \u2014 "+TIERS[it.tier][2]:it.tier===-2?"toward under 90% \u2014 ran out here":"highest rate left \u00b7 "+it.apr.toFixed(1)+"%";
    if(it.to<=0)why="paid off"+(card?" \u2014 keep the card open":"")+" \u00b7 frees "+money(it.min)+"/mo";
    return '<div style="display:flex;gap:11px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center">'+
      '<div class="num" style="width:20px;flex-shrink:0;font-size:11px;color:var(--dim)">'+(i+1)+'</div>'+
      '<div style="flex:1;min-width:0">'+
        '<div style="font-weight:700;font-size:13px">'+esc(it.name)+'</div>'+
        '<div class="note" style="font-size:10.5px">'+
          (card?'<span class="num">'+utilLabel(it.from,it.limit)+' \u2192 <b style="color:'+utilCol(it.to/it.limit)+'">'+utilLabel(it.to,it.limit)+'</b></span> \u00b7 ':
                '<span class="num">'+money(it.from)+' \u2192 '+money(it.to)+'</span> \u00b7 ')+why+'</div></div>'+
      '<div class="num" style="font-size:15px;font-weight:800;color:var(--green)">'+money(it.amt)+'</div></div>';}).join("");
  return rows;
}
function windOut(){
  var W=Math.round(Number(windTest)||0);
  if(W<=0)return '<div class="card pad" style="border-left:3px solid var(--violet)">'+
    '<div class="eyebrow">How it decides</div>'+
    '<ol style="font-size:13px;line-height:1.7;padding-left:20px;margin:9px 0 0">'+
      '<li><b>Cash first.</b> The two-month forecast is kept at least '+money(CASH_FLOOR)+' above zero before a dollar goes to debt. A late payment costs more score than any payoff buys back.</li>'+
      '<li><b>Every card under 90%.</b> A maxed card is the worst thing on the file after the late itself \u2014 it is what set off the limit cuts.</li>'+
      '<li><b>Small cards paid off outright.</b> Anything under '+money(CHEAP_KILL)+' goes to zero: one less account with a balance, and its draft comes back every month.</li>'+
      '<li><b>Then every card under 50%, 30%, 10%, and to zero,</b> cheapest to cross first, so more cards clear per dollar.</li>'+
      '<li><b>Then loans and plans, highest rate first.</b> A lump sum saves interest at the rate, not the balance, so the 36% Affirm and Klarna plans come before the bigger Upstart loans.</li></ol>'+
    '<p class="note" style="margin-top:11px">Type an amount above and it lays out exactly where each dollar goes and what it does to the debt-free date, the interest, and utilisation.</p></div>';

    '<div class="eyebrow">Keep in checking</div>'+
    '<div class="num" style="font-size:26px;font-weight:800;color:var(--amber);margin:6px 0 4px">'+money(r.reserve)+'</div>'+
    '<div class="note">The forecast bottoms out at <b>'+signed(r.trough.bal)+'</b> on '+fmtDate(r.trough.date)+'. This keeps it at least '+money(CASH_FLOOR)+' above zero. Nothing below is worth a late payment.</div></div>':'';
  var altNote='';
  if(r.alt&&r.alt.first){
    var d=Math.round(a.interest-r.alt.interest);

      (d>0?'saves about <b class="num">'+money(d)+'</b> more interest over the whole payoff':'saves no more interest')+
      ', lands debt-free <b>'+r.alt.free+'</b>, and leaves utilisation at <b class="num">'+Math.round(r.alt.util*100)+'%</b> instead of <b class="num">'+Math.round(a.util*100)+'%</b>. '+
      'The credit-first order is the one to use: the cards report every month, the loans barely register, and the interest gap is small because the card rates are just as high.</p></div>';
  }
  var leftover=r.leftover>0?'<div class="card pad" style="border-left:3px solid var(--green)"><div class="eyebrow">Left over</div>'+
    '<div class="num" style="font-size:22px;font-weight:800;margin:6px 0 4px;color:var(--green)">'+money(r.leftover)+'</div>'+
    '<div class="note">Everything in the plan is paid. Put it toward the cars or keep it as a cushion.</div></div>':'';
  return reserve+
   '<div class="tiles">'+
    tile("\u25C8","#22C55E","Debt-free",a.free,(mo?mo+" month"+(mo>1?"s":"")+" sooner \u00b7 was "+b.free:"same month \u00b7 was "+b.free))+
    tile("\u2193","#3E6AE1","Interest saved",money(saved),"across the rest of the payoff")+
    tile("\u25CE","#E31937","Utilisation",Math.round(b.util*100)+"% \u2192 "+Math.round(a.util*100)+"%",a.over30+" card"+(a.over30===1?"":"s")+" over 30%, was "+b.over30)+
    tile("\u2713","#F59E0B","Paid off outright",a.zeroed,money(a.freed)+"/mo of drafts freed")+
   '</div>'+
   '<div class="card"><div style="padding:15px 16px;border-bottom:1px solid var(--line)">'+
     '<div style="font-size:14px;font-weight:700">Send it here, in this order</div>'+
     '<div class="note">Pay each card <b>before its statement closes</b>, not just before the due date \u2014 the statement balance is the one that gets reported. Then tap the button so the plan knows.</div></div>'+
     windRows(r)+
     '<div style="padding:14px 16px"><button class="btn" data-act="applywind">I sent these \u2014 update the balances</button></div></div>'+
   altNote+leftover;
}
function paintWind(){var e=document.getElementById("windout");if(e)e.innerHTML=windOut();}
function viewWind(){
  var chips=[500,1000,2500,5000].map(function(v){

   Everyone who opens this link sees the same balances. They live in one
   GitHub gist; this page reads it on open and every few seconds, and writes
   it whenever a number changes. The newer revision always wins, so a phone

    var si=document.getElementById("spendin");if(si)si.value=spendTest;paintSpend();return;}
  if(b.dataset.wind){windTest=b.dataset.wind;
    var wi=document.getElementById("windin");if(wi)wi.value=windTest;paintWind();return;}
  var act=b.dataset.act;
  if(act==="rpplay"){if(RP.playing){rpStop();b.textContent="\u25B6 Play";}else rpPlay();return;}
  if(act==="rpmode"){RP.mode=RP.mode==="3d"?"flat":"3d";var pl=RP.playing;render();if(pl)rpPlay();else if(RP.mode==="3d"&&!RP.raf)RP.raf=requestAnimationFrame(rpFrame);return;}
  if(act==="rpspeed"){RP.perMonth=RP.perMonth<=350?700:300;b.textContent=RP.perMonth<=350?"Fast":"Normal";return;}
  if(act==="applywind"){
    var wp=windfallPlan(windTest);
    if(!wp.items.length){toast("Nothing to apply");return;}
    wp.items.forEach(function(it){state.accounts[it.name]=Math.max(0,Math.round(it.to));});
    var n=wp.items.length,z=wp.after.zeroed;
    windTest="";save();render();
    toast(n+" balance"+(n>1?"s":"")+" updated"+(z?" · "+z+" paid off — keep the cards open":""));return;}
  if(act==="snapshot"){
    var d=new Date().toISOString().slice(0,10),tt=Math.round(totals().remaining);
    state.history=state.history.filter(function(h){return h.date!==d;}).concat([{date:d,total:tt}])
      .sort(function(p,q){return p.date.localeCompare(q.date);});
    save();render();toast("Recorded "+money(tt)+" for "+d);}
  if(act==="addspend"){
    var ai=document.getElementById("spamt"),ni=document.getElementById("spnote");
    var amt=Number(ai&&ai.value)||0;
    if(amt<=0){toast("Put an amount in first");return;}
    state.spend=(state.spend||[]).concat([{id:Date.now(),date:new Date().toISOString().slice(0,10),
      amount:Math.round(amt*100)/100,note:(ni&&ni.value||"").slice(0,60)}]);
    save();render();toast("Logged "+money(amt));}
  if(act==="copylink"){var u=syncLink();
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(u).then(function(){toast("Link copied — text it over");},function(){showLink(u);});
    else showLink(u);}
  if(act==="showlink")showLink(syncLink());
  if(act==="reset"){if(confirm("Reset every balance on this device?")){
    state={accounts:defaults(),cash:{balance:0,updated:null},history:[],spend:[]};save();render();toast("Reset");}}
});
function showLink(u){var e=document.getElementById("linkbox");if(!e)return;
  e.innerHTML='<textarea readonly rows="4" style="width:100%;font-family:var(--mono);font-size:11px;text-align:left">'+esc(u)+'</textarea><div class="note" style="margin-top:6px">Select all and copy.</div>';
  var t=e.querySelector("textarea");t.focus();t.select();}
document.addEventListener("input",function(e){
  if(e.target&&e.target.id==="spendin"){spendTest=e.target.value;paintSpend();}
  if(e.target&&e.target.id==="windin"){windTest=e.target.value;paintWind();}
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.bal){state.accounts[el.dataset.bal]=Math.max(0,Number(el.value)||0);save();render();}
  if(el.id==="cashin"){state.cash={balance:Math.round(Number(el.value)||0),updated:new Date().toISOString()};save();render();}});
load();render();if(!PRIVATE)gsPull();
</script>
</body>
</html>
